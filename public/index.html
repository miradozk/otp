<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OTP</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1c1f24; --muted: #6b7280;
    --accent: #2563eb; --danger: #dc2626; --border: #e5e7eb; --bar: #dbeafe;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --card: #1a1f26; --text: #e6e8eb; --muted: #9aa3b2;
      --accent: #60a5fa; --danger: #f87171; --border: #2a313b; --bar: #1e3a5f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1rem; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 1.5rem; }
  h2 { font-size: 1rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; margin: 2rem 0 .75rem; }

  form {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem;
    display: grid; gap: .75rem;
  }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
  label { display: grid; gap: .25rem; font-size: .875rem; color: var(--muted); }
  input, select {
    font: inherit; padding: .5rem .75rem; border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text);
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  button {
    font: inherit; font-weight: 600; padding: .6rem 1rem; border: 0; border-radius: 8px;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  .error { color: var(--danger); font-size: .875rem; margin: 0; min-height: 1.3em; }

  #list { display: grid; gap: .75rem; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.25rem;
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: .25rem 1rem;
    position: relative; overflow: hidden;
  }
  .card .name { font-weight: 600; }
  .card .code {
    grid-column: 1; font: 700 2rem/1.2 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    letter-spacing: .12em; cursor: pointer; user-select: none;
  }
  .card .code:hover { color: var(--accent); }
  .card .meta { grid-column: 1; font-size: .8rem; color: var(--muted); }
  .card .delete {
    grid-column: 2; grid-row: 1 / span 3; background: transparent; color: var(--muted);
    font-weight: 500; padding: .4rem .6rem;
  }
  .card .delete:hover { color: var(--danger); }
  .card .bar { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--accent); width: 100%; }
  .empty { color: var(--muted); text-align: center; padding: 2rem 0; }
</style>
</head>
<body>
<main>
  <h1>Codes OTP</h1>

  <form id="add">
    <div class="row">
      <label>Nom <input name="name" required autocomplete="off" placeholder="github" pattern="[A-Za-z0-9._\-]{1,64}"></label>
      <label>Secret (base32) <input name="secret" required autocomplete="off" placeholder="JBSWY3DPEHPK3PXP"></label>
    </div>
    <div class="row">
      <label>Chiffres
        <select name="digits"><option value="6">6</option><option value="8">8</option></select>
      </label>
      <label>Période (s) <input name="period" type="number" min="1" max="300" value="30"></label>
    </div>
    <p class="error" id="form-error"></p>
    <button type="submit">Ajouter</button>
  </form>

  <h2>Secrets</h2>
  <div id="list"></div>
</main>

<script>
// --- Accès à l'API JSON -----------------------------------------------------

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = res.status === 204 ? {} : await res.json();
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

// --- Liste des cartes -------------------------------------------------------

const list = document.getElementById('list');
const cards = new Map(); // name → { name, el, codeEl, metaEl, barEl, timer }

function renderEmpty() {
  list.innerHTML = '<p class="empty">Aucun secret. Ajoute-en un ci-dessus.</p>';
}

function createCard(name) {
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `
    <div class="name"></div>
    <div class="code" title="Cliquer pour copier">······</div>
    <div class="meta"></div>
    <button class="delete" title="Supprimer">✕</button>
    <div class="bar"></div>`;
  el.querySelector('.name').textContent = name;

  const card = {
    name, el,
    codeEl: el.querySelector('.code'),
    metaEl: el.querySelector('.meta'),
    barEl: el.querySelector('.bar'),
    timer: null,
  };

  card.codeEl.addEventListener('click', () => copyCode(card));
  el.querySelector('.delete').addEventListener('click', () => removeSecret(card));
  return card;
}

async function loadList() {
  const { names } = await api('GET', '/secrets');
  for (const card of cards.values()) clearInterval(card.timer);
  cards.clear();
  list.innerHTML = '';
  if (names.length === 0) return renderEmpty();
  for (const name of names) {
    const card = createCard(name);
    cards.set(name, card);
    list.append(card.el);
    refreshCode(card);
  }
}

async function refreshCode(card) {
  try {
    const { code, expires_in, period } = await api('GET', `/otp/${encodeURIComponent(card.name)}`);
    card.codeEl.textContent = code;
    scheduleRefresh(card, expires_in, period);
  } catch (e) {
    card.codeEl.textContent = '——————';
    card.metaEl.textContent = e.message;
  }
}

/** Met à jour le texte « expire dans N s » et la largeur de la barre. */
function updateCountdown(card, remaining, period) {
  card.metaEl.textContent = `expire dans ${remaining} s`;
  card.barEl.style.width = `${(remaining / period) * 100}%`;
}

/**
 * Anime le compte à rebours d'une carte et redemande le code à l'expiration.
 *
 * Contrat :
 *  - le serveur a dit qu'il reste `expiresIn` secondes (1 ≤ expiresIn ≤ period) ;
 *  - appelle updateCountdown(card, restant, period) pour peindre la barre et le texte ;
 *  - appelle refreshCode(card) quand le temps est écoulé (refreshCode rappellera
 *    scheduleRefresh avec le nouveau code, donc ça boucle) ;
 *  - card.timer est le seul handle de minuterie de la carte : le nettoyer avant
 *    d'en créer un nouveau (clearInterval / clearTimeout), sinon les timers
 *    s'accumulent à chaque rafraîchissement.
 *
 * Choix ouvert : compter localement chaque seconde et refetcher à 0 (1 requête
 * par période, mais dérive si l'onglet est mis en veille), ou re-poller le
 * serveur plus souvent (toujours juste, plus de requêtes), ou un mélange.
 */
function scheduleRefresh(card, expiresIn, period) {
  clearInterval(card.timer);
  let remaining = expiresIn;
  updateCountdown(card, remaining, period);
  card.timer = setInterval(() => {
    remaining -= 1;
    updateCountdown(card, Math.max(remaining, 0), period);
    if (remaining <= 0) {
      clearInterval(card.timer);
      refreshCode(card);
    }
  }, 1000);
}

// Les timers sont ralentis quand l'onglet est en veille : au retour, on
// redemande tous les codes plutôt que de faire confiance au compteur local.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    for (const card of cards.values()) refreshCode(card);
  }
});

async function copyCode(card) {
  try {
    await navigator.clipboard.writeText(card.codeEl.textContent);
    const previous = card.metaEl.textContent;
    card.metaEl.textContent = 'copié !';
    setTimeout(() => { if (card.metaEl.textContent === 'copié !') card.metaEl.textContent = previous; }, 1200);
  } catch { /* presse-papiers indisponible (http non sécurisé, permissions) : on ignore */ }
}

async function removeSecret(card) {
  try {
    await api('DELETE', `/secrets/${encodeURIComponent(card.name)}`);
    clearInterval(card.timer); clearTimeout(card.timer);
    cards.delete(card.name);
    card.el.remove();
    if (cards.size === 0) renderEmpty();
  } catch (e) {
    card.metaEl.textContent = e.message;
  }
}

// --- Formulaire d'ajout -----------------------------------------------------

const form = document.getElementById('add');
const formError = document.getElementById('form-error');

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  formError.textContent = '';
  const data = new FormData(form);
  const button = form.querySelector('button');
  button.disabled = true;
  try {
    await api('POST', '/secrets', {
      name: data.get('name').trim(),
      secret: data.get('secret'),
      digits: Number(data.get('digits')),
      period: Number(data.get('period')),
    });
    form.reset();
    form.elements.name.focus();
    await loadList();
  } catch (e) {
    formError.textContent = e.message;
  } finally {
    button.disabled = false;
  }
});

loadList().catch((e) => { list.innerHTML = `<p class="error">${e.message}</p>`; });
</script>
</body>
</html>
